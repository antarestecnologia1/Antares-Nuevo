name: Keep API awake

# Render suspende la API sin tráfico y el primer ingreso del día tarda ~1 min.
# Este ping cada 10 minutos la mantiene despierta (GET /api/health no toca la base de datos).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" https://antares-nuevo.onrender.com/api/health || echo 000)
            echo "intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          exit 1
